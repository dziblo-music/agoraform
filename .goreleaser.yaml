# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: agoraform

builds:
  - id: agoraform
    main: ./cmd/agoraform
    binary: agoraform
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/dziblo-music/agoraform/internal/cli.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      - examples/agoraform.yaml
      - examples/README.md
      - examples/matomo-conversion/README.md
      - examples/matomo-conversion/agoraform.yaml
      - examples/googleads-conversion/README.md
      - examples/googleads-conversion/agoraform.yaml
      - examples/googleads-search/README.md
      - examples/googleads-search/agoraform.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    Agoraform {{ .Version }}

    SemVer 2.0 release. `agoraform --version` prints `{{ .Version }}`.
    The git tag is `v{{ .Version }}`.

    **Supported in 0.3.x:** `validate`, `plan`, `apply`, and `import` for Matomo goals and supported Tag Manager resources, plus Google Ads website conversion actions and customer conversion-goal biddability. State remains local; mutations are create/update only and `destroy` is not implemented.

    This GitHub release is created as a **draft**. Publish it only after a clean install of a release artifact and the documented v0.3 Google Ads create/update/no-op/import verification have succeeded against a non-production account.

    Full notes: [CHANGELOG.md](https://github.com/dziblo-music/agoraform/blob/v{{ .Version }}/CHANGELOG.md)
  footer: |
    ## Verify

    Compare SHA-256 checksums against `checksums.txt` before running the binary.

    ```bash
    agoraform --version   # prints {{ .Version }}
    ```

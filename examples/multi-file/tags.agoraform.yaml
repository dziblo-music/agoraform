# Custom Event trigger and Matomo Analytics tag. The tag $ref values
# resolve against resources declared in other files in this directory.

apiVersion: agoraform.io/v1alpha1
resources:
  - address: matomo.trigger.trial_started
    attributes:
      type: customEvent
      event: trialStarted
      name: Trial started

  - address: matomo.tag.trial_started
    attributes:
      type: matomoAnalytics
      name: Track trial started
      trigger:
        $ref: matomo.trigger.trial_started
      eventCategory: trial
      eventAction: started
      eventName:
        $ref: matomo.variable.user_id

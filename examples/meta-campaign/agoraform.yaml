apiVersion: agoraform.io/v1alpha1

providers:
  meta: {}

resources:
  - address: meta.campaign.acquisition
    attributes:
      name: Website Acquisition
      objective: OUTCOME_SALES
      status: PAUSED
      specialAdCategories: []
      buyingType: AUCTION
      # Meta budgets use account-currency minor units: 50000 = USD 500.00.
      lifetimeBudgetMinorUnits: 50000
      bidStrategy: LOWEST_COST_WITHOUT_CAP
